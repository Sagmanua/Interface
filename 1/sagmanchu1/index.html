<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
    | interfaz integrada
  </title>
  <link href="https://static.jocarsa.com/logos/white.svg" rel="shortcut icon" type="image/svg+xml"/>
  <link href="css/estilo.css" rel="stylesheet"/>
  <link href="css/asistente.css" rel="stylesheet"/>
 </head>
 <body class="jocarsa-iu">
  <header>
   <div class="corporativo">
    <img alt="" src="https://static.jocarsa.com/logos/white.svg"/>
    <h1>
     jocarsa | interfaz integrada
    </h1>
   </div>
   <div id="herramientas">
    <input id="buscador" placeholder="Buscar en clientes…" type="search"/>
    <button id="nuevo">
     + Nuevo
    </button>
    <button id="btnAsistente" title="Abrir asistente (o di &quot;assistant&quot;)">
     🎙 Assistant
    </button>
    <button id="btnEjercicios" title="Interfaces naturales: gestos, rostro, AR y VR" onclick="location.href='natural-ui/index.html'">
     🧪 Ejercicios
    </button>
   </div>
   <div id="usuario">
    <div class="imagen">
    </div>
    <div>
     <p>
      Jose Vicente Carratalá
     </p>
     <a href="login.html">
      Cerrar sesión
     </a>
    </div>
   </div>
  </header>
  <main>
   <nav id="navegacion">
    <div class="contenido-columna">
    </div>
    <button class="minimizar" title="Minimizar">
     ◀
    </button>
   </nav>
   <div class="separador" data-left="navegacion">
   </div>
   <section id="entidades">
    <div class="contenido-columna">
    </div>
    <button class="minimizar" title="Minimizar">
     ◀
    </button>
   </section>
   <div class="separador" data-left="entidades">
   </div>
   <div class="escenario" id="escenario">
   </div>
  </main>
  <template id="tpl-nav">
   <a href="#">
    <span class="ficha">
    </span>
    <span class="etiqueta">
    </span>
   </a>
  </template>
  <template id="tpl-card">
   <article draggable="true">
    <span class="ficha">
    </span>
    <span class="etiqueta">
    </span>
   </article>
  </template>
  <template id="tpl-fila">
   <tr>
   </tr>
  </template>
  <!-- Componentes flotantes globales -->
  <div class="ju-drawer-overlay" id="juDrawerOverlay" aria-hidden="true"></div>
  <aside class="ju-drawer" id="juDrawer" aria-hidden="true" aria-label="Editor lateral">
   <div class="ju-drawer-resizer" id="juDrawerResizer" title="Arrastra para redimensionar"></div>
   <header class="ju-drawer-header">
    <div>
     <small id="juDrawerMode">CREAR</small>
     <h2 id="juDrawerTitle">Nuevo registro</h2>
    </div>
    <button class="ju-drawer-close" id="juDrawerClose" type="button" aria-label="Cerrar">×</button>
   </header>
   <div class="ju-drawer-body" id="juDrawerBody"></div>
  </aside>

  <div class="ju-modal-layer" id="juModal" aria-hidden="true">
   <div class="ju-modal-backdrop" data-modal-close></div>
   <section class="ju-modal-window" role="dialog" aria-modal="true" aria-labelledby="juModalTitle">
    <header class="ju-modal-header">
     <h2 id="juModalTitle">Ventana modal</h2>
     <button class="ju-modal-close" type="button" data-modal-close aria-label="Cerrar">×</button>
    </header>
    <div class="ju-modal-body" id="juModalBody"></div>
   </section>
  </div>

  <!-- Asistente de voz (usa divs: estilo.css aplica reglas globales a header/section) -->
  <div class="ju-asistente" id="asistente" aria-hidden="true" aria-label="Asistente de voz" data-estado="off">
   <div class="ju-as-top">
    <div>
     <small id="asEstado">MIC OFF</small>
     <h2>Assistant</h2>
    </div>
    <div class="ju-as-botones">
     <select id="asIdioma" title="Idioma de voz / Language / Язык">
      <option value="en-US">EN</option>
      <option value="es-ES">ES</option>
      <option value="ru-RU">RU</option>
     </select>
     <button id="asDictado" type="button" title="Dictado: habla dentro del campo seleccionado">✍</button>
     <button id="asMic" type="button" title="Activar micrófono">🎙</button>
     <button id="asCerrar" type="button" aria-label="Cerrar">×</button>
    </div>
   </div>
   <div class="ju-as-log" id="asLog" aria-live="polite"></div>
   <form class="ju-as-form" id="asForm" autocomplete="off">
    <input id="asTexto" placeholder="Type, or say “assistant…”"/>
    <button class="ju-btn" type="submit">Send</button>
   </form>
  </div>

  <script src="js/componentes.js">
  </script>
  <script src="js/voz-comandos.js">
  </script>
  <script src="js/asistente.js">
  </script>
 </body>
</html>
